COM_MEDIACLEANER_HELP="Help"
COM_MEDIACLEANER_HELP_TITLE="Media Cleaner - Help"
COM_MEDIACLEANER_HELP_INTRO_TITLE="Over Media Cleaner"
COM_MEDIACLEANER_HELP_FEATURES_TITLE="Functies van Media Cleaner"
COM_MEDIACLEANER_HELP_RESCAN_TITLE="Scan opnieuw uitvoeren"
COM_MEDIACLEANER_HELP_RESCAN_BODY="Doorzoekt de hele website opnieuw en werkt het overzicht bij. Nodig na het toevoegen, verwijderen of aanpassen van bestanden of content elders op de site, en na het wijzigen van een instelling op het Opties-scherm. Na het installeren van een update start dit ook automatisch op de achtergrond."
COM_MEDIACLEANER_HELP_FILTERS_TITLE="Alle media / Gekoppelde media / Niet-gekoppelde media / Genegeerde media"
COM_MEDIACLEANER_HELP_FILTERS_BODY="Vier gelijkwaardige knoppen, elk met een eigen, volledig overzicht: \"Alle media\" toont alles, \"Gekoppelde media\" en \"Niet-gekoppelde media\" filteren op koppelingsstatus, en \"Genegeerde media\" toont elk bestand dat je bewust als genegeerd hebt gemarkeerd (zie \"Negeren\" hieronder) - ongeacht of het gekoppeld was of niet. Ernaast staat nog een link \"Verwijderde media\", die naar een apart overzicht gaat - zie hieronder."
COM_MEDIACLEANER_HELP_IGNORE_TOGGLE_TITLE="Bulkselectie voor negeren/verwijderen"
COM_MEDIACLEANER_HELP_IGNORE_TOGGLE_BODY="Verschijnt bij \"Niet-gekoppelde media\" én \"Gekoppelde media\" zodra er bestanden met een extensie-hint zijn (zie \"Hoort mogelijk bij extensie ...\" hierboven). Hiermee negeer je in één keer alle bestanden met diezelfde hint, zonder ze een voor een aan te vinken - handig wanneer een extensie honderden losse bestanden achterlaat, of wanneer een template of plugin tientallen \"Waarschijnlijk gekoppeld\" bestanden in de lijst zet. Bij \"Gekoppelde media\" is alleen negeren mogelijk, geen verwijderen - dat blijft voorbehouden aan \"Niet-gekoppelde media\", om te voorkomen dat bestanden van een nog actieve extensie per ongeluk worden weggegooid."
COM_MEDIACLEANER_HELP_IGNORE_ACTION_TITLE="Negeren / Herstel genegeerd"
COM_MEDIACLEANER_HELP_IGNORE_ACTION_BODY="Markeert een niet-gekoppeld bestand als bewust behouden en verplaatst het naar het overzicht \"Genegeerde media\" (zie hierboven), zodat het niet langer als aandachtspunt bij Niet-gekoppeld wordt getoond. Verplaatst of verwijdert niets op de schijf. \"Herstel genegeerd\" maakt dit ongedaan."
COM_MEDIACLEANER_HELP_DELETE_TITLE="Verwijderen (tijdelijk)"
COM_MEDIACLEANER_HELP_DELETE_BODY="Verplaatst een niet-gekoppeld bestand naar een beveiligde, tijdelijke map - niet bereikbaar vanaf de website, maar nog niet definitief weg. Kan per bestand of, via de keuzelijst \"Actie voor geselecteerde items\" boven de tabel, voor meerdere geselecteerde bestanden tegelijk."
COM_MEDIACLEANER_HELP_QUARANTINE_TITLE="Verwijderde media"
COM_MEDIACLEANER_HELP_QUARANTINE_BODY="Opent het overzicht van alle tijdelijk verwijderde bestanden (ook wel \"Tijdelijk verwijderd\" genoemd), inclusief een voorbeeldminiatuur per bestand. Hier kun je ze terugzetten naar hun oorspronkelijke locatie, of definitief verwijderen."
COM_MEDIACLEANER_HELP_COLUMNS_TITLE="De kolommen"
COM_MEDIACLEANER_HELP_COLUMNS_BODY="Voorbeeld toont een thumbnail (of een neutraal icoon als dat niet mogelijk is); Bestandsnaam, Bestandsgrootte, Locatie en Type spreken voor zich; Gekoppeld toont of het bestand nog wordt gebruikt; Actie bevat de knoppen om het bestand te beheren."
COM_MEDIACLEANER_HELP_REFERENCES_TITLE="Dieptelinks (bij Gekoppelde media)"
COM_MEDIACLEANER_HELP_REFERENCES_BODY="Onder de bestandsnaam van gekoppelde bestanden zie je precies waar het bestand wordt gebruikt (bijvoorbeeld een artikel of module), met een directe link naar de bijbehorende beheerpagina."
COM_MEDIACLEANER_HELP_WEBP_TITLE="Comprimeer naar WebP (bij Gekoppelde media)"
COM_MEDIACLEANER_HELP_WEBP_BODY="Maakt een nieuwe, gecomprimeerde kopie van een afbeelding in WebP-formaat, naast het origineel - er wordt niets overschreven of verwijderd. Je moet de verwijzing in het artikel of de module zelf nog handmatig aanpassen naar het nieuwe bestand."
COM_MEDIACLEANER_HELP_ORPHANED_TITLE="\"Hoort mogelijk bij een niet meer geïnstalleerde Joomla-extensie\" / \"Hoort mogelijk bij extensie: ...\""
COM_MEDIACLEANER_HELP_ORPHANED_BODY="Deze opmerkingen verschijnen onder de locatie van een bestand. Zit het bestand in de map \"images\", of in een map van een component, module, plugin of template, dan wordt de extensie met naam genoemd zodra de mapnaam overeenkomt met een geïnstalleerde extensie (actief of niet) - of, als die niet meer gevonden wordt, met een extensie die hier vroeger wél stond (\"... maar deze extensie lijkt te zijn verwijderd\"). Deze naam-hint verschijnt ook bij \"Gekoppelde media\" (vaak \"Waarschijnlijk gekoppeld\" bestanden van de actieve template zelf). Kan de naam niet worden bepaald, dan verschijnt bij een niet-gekoppeld bestand in een component-, module-, plugin- of templatemap nog wel een algemene waarschuwing dat de extensie mogelijk niet meer geïnstalleerd is. Vaak een teken dat het bestand overbleef nadat de bijbehorende extensie is uitgeschakeld of verwijderd."
COM_MEDIACLEANER_HELP_OPTIONS_TITLE="Opties (tabblad Instellingen)"
COM_MEDIACLEANER_HELP_OPTIONS_BODY="Drie schakelaars op dit tabblad geven extra toelichting en bescherming bij \"Niet-gekoppelde media\", voor bestanden in mappen met de naam \"thumbs\", bestanden van actieve componenten/modules/plugins/templates, en mediabestanden van actieve extensies. Deze bestanden blijven altijd gewoon zichtbaar en meegeteld bij \"Niet-gekoppelde media\" - de schakelaars bepalen alleen of er een toelichtende tekst bij staat (bij de eerste) en of ze zijn uitgesloten van de bulkactie \"Bulkselectie voor negeren/verwijderen\" (bij de laatste twee), zodat je nooit per ongeluk bestanden van een nog actieve extensie in één keer meeverwijdert. Na het opslaan van Opties wordt automatisch een nieuwe scan gestart."

; Frontend (website) rechten - te vinden op het tabblad "Machtigingen" van het
; opties-scherm van dit component.
COM_MEDIACLEANER_ACL_SITE_VIEW="Website: Overzicht bekijken"
COM_MEDIACLEANER_ACL_SITE_VIEW_DESC="Staat een gebruiker toe het media-overzicht te bekijken op de website, als daarvoor een menu-item bestaat. Hier is standaard niets toegekend, dus het koppelen van het menu-item aan een breed zichtbaar toegangsniveau (bijv. Openbaar) maakt op zichzelf nog niets zichtbaar - een groep heeft deze rechten expliciet nodig."
COM_MEDIACLEANER_ACL_SITE_IGNORE="Website: Bestanden negeren"
COM_MEDIACLEANER_ACL_SITE_IGNORE_DESC="Staat een gebruiker toe om vanaf de website bestanden als genegeerd te markeren (en dat ongedaan te maken). Vereist ook \"Website: Overzicht bekijken\". Nooit beschikbaar voor bezoekers die niet zijn ingelogd, ongeacht deze instelling."
COM_MEDIACLEANER_ACL_SITE_DELETE="Website: Bestanden verwijderen"
COM_MEDIACLEANER_ACL_SITE_DELETE_DESC="Staat een gebruiker toe om vanaf de website bestanden naar de tijdelijke verwijdering te verplaatsen. Vereist ook \"Website: Overzicht bekijken\". Nooit beschikbaar voor bezoekers die niet zijn ingelogd, ongeacht deze instelling."

