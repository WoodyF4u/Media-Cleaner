COM_MEDIACLEANER_HELP_LINKS_BODY="Zoekt in de hele database naar verwijzingen naar bestanden van deze site die niet bestaan: een foto die nooit is geüpload, een pop-uplink (JCE MediaBox) naar een grote foto die ontbreekt - dan toont de pop-up niets of een sip gezichtje - of een tikfout zoals foto-1jpg. Per verwijzing zie je waar hij staat (met een knop Bewerken) en kies je een oplossing: laten wijzen naar een bestaand bestand (Media Cleaner stelt voor: andere hoofdletters, ontbrekende punt, zelfde naam met een andere extensie, zelfde bestand in een andere map, de kleine foto uit de link), de pop-uplink weghalen en de kleine foto laten staan, de afbeelding weghalen, of zelf een pad invullen. Staat de site in een submap, dan worden links die met / beginnen en naar de hoofdmap van het domein wijzen apart getoond als Buiten deze site: ze werken nu nog, maar alleen dankzij een andere site. Elke reparatie staat onder Gerepareerd en is daar ongedaan te maken."
