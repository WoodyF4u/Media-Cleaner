COM_MEDIACLEANER_CONFIG_SCAN_LABEL="Instellingen"
COM_MEDIACLEANER_CONFIG_UNLINKED_HEADING="Toelichting en bescherming bij \"Niet gekoppelde media\""
COM_MEDIACLEANER_CONFIG_HEADING_STYLE_HACK="<style>.control-group.mc-config-heading,.control-group:has(.mc-config-heading){display:block;width:100%;}.mc-config-heading h4{font-weight:bold;font-size:1.15rem;margin:1.25rem 0 0.5rem;width:100%;}.control-group.mc-config-heading-style,.control-group:has(.mc-config-heading-style){display:none;}</style>"
COM_MEDIACLEANER_CONFIG_HIDE_THUMBS_LABEL="'thumbs'-mappen in de map 'images'"
COM_MEDIACLEANER_CONFIG_HIDE_THUMBS_DESC="Indien ingeschakeld worden nieuw gevonden, niet-gekoppelde bestanden in mappen met de naam 'thumbs' automatisch genegeerd bij het scannen (ze verschijnen direct onder 'Genegeerde media' in plaats van onder 'Niet gekoppelde media'), omdat dit vrijwel altijd automatisch gegenereerde cache is die de extensie zelf opnieuw aanmaakt zodra dat nodig is. Zet je een bestand handmatig terug naar niet-genegeerd, dan onthoudt de component dat: een volgende scan negeert dat specifieke bestand niet opnieuw. Indien uitgeschakeld blijven deze bestanden gewoon onder 'Niet gekoppelde media' staan, met een toelichting erbij."
COM_MEDIACLEANER_CONFIG_HIDE_EXT_ASSETS_LABEL="Bestanden van actieve componenten/modules/plugins/templates"
COM_MEDIACLEANER_CONFIG_HIDE_EXT_ASSETS_DESC="Indien ingeschakeld worden bestanden van nog geïnstalleerde en actieve extensies uitgesloten van de bulkactie \"Verwijderen\" binnen de bulkselectie, zodat je ze nooit per ongeluk in één keer meeverwijdert samen met écht overbodige bestanden - bulk \"Negeren\" blijft altijd op alle gehinte bestanden werken, ook deze, want dat is altijd terug te draaien per bestand. De bestanden zelf blijven altijd gewoon zichtbaar en meegeteld bij 'Niet gekoppelde media', mét een toelichting welke extensie het waarschijnlijk is. Bestanden van uitgeschakelde of verwijderde extensies zijn nooit beschermd, ongeacht deze instelling."
COM_MEDIACLEANER_CONFIG_HIDE_EXT_IMAGES_LABEL="Media-bestanden van actieve extensies"
COM_MEDIACLEANER_CONFIG_HIDE_EXT_IMAGES_DESC="Hetzelfde, maar dan voor bestanden in `/images/.../`-mappen van nog geïnstalleerde en actieve componenten - zie de toelichting hierboven."

COM_MEDIACLEANER_HELP_PROBABLE_TITLE="Gekoppeld vs. waarschijnlijk gekoppeld"
COM_MEDIACLEANER_HELP_PROBABLE_BODY="Elke scan doorzoekt automatisch, naast Joomla's eigen artikelen/modules/menu's/etc., ook alle andere databasetabellen op de site en de broncode van templates, plugins en componenten - zo worden ook extensies van derden (agenda's, downloadbeheer, enzovoort) meegenomen, zonder dat ik ze met naam hoef toe te voegen. Een groen label \"Gekoppeld\" betekent dat het volledige pad van het bestand ergens is gevonden; een oranje label \"Waarschijnlijk gekoppeld\" betekent dat alleen de exacte bestandsnaam is gevonden (sommige extensies bewaren alleen een kale bestandsnaam, niet de map) - vrijwel altijd een echte koppeling, maar controleer dit voor het verwijderen, omdat een naam-match inherent iets minder zeker is dan een volledige-padmatch."
COM_MEDIACLEANER_RESCAN_IN_PROGRESS="Bezig met scannen…"
COM_MEDIACLEANER_REF_BAGALLERY="BA Gallery-item"

; Afgeleide bestanden (v2.8.0)
COM_MEDIACLEANER_LINKED_DERIVED="Gekoppeld via origineel"
COM_MEDIACLEANER_LINKED_DERIVED_HINT="Automatisch gemaakte thumbnail of verkleinde kopie van een ander bestand dat wél gekoppeld is. Blijft gekoppeld zolang het origineel dat is; de extensie maakt dit bestand zo nodig zelf opnieuw aan."
