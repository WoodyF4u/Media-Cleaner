COM_MEDIACLEANER_LINK_CHECK_NOTE="Media Cleaner doorzoekt Joomla's eigen artikelen, modules, categorieën, menu-items, aangepaste velden, contactpersonen en banners, daarnaast alle overige databasetabellen op de site, en de broncode (PHP/CSS/JS/XML) van templates, plugins, modules en componenten - waardoor ook extensies van derden worden herkend zonder dat hun naam vooraf bekend hoeft te zijn. Bestanden die alleen ergens anders worden aangeroepen (bijvoorbeeld vanuit een handmatig bewerkt serverconfiguratiebestand, of code buiten deze mappen) kunnen hierdoor niet worden herkend. Controleer daarom altijd handmatig voordat je een bestand dat als \"Niet gekoppeld\" is gemarkeerd, verwijdert."
