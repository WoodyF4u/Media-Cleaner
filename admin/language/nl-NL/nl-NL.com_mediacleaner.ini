COM_MEDIACLEANER_LINKED_PROBABLE="Waarschijnlijk gekoppeld"
COM_MEDIACLEANER_LINKED_PROBABLE_HINT="Alleen de bestandsnaam is gevonden (niet het volledige pad), in de eigen gegevens van een extensie van derden - hoogstwaarschijnlijk een echte koppeling, maar minder zeker dan een volledige-padmatch. Controleer dit voordat je verwijdert."
