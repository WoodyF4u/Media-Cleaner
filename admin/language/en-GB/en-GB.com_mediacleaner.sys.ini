COM_MEDIACLEANER="Media Cleaner"
COM_MEDIACLEANER_XML_DESCRIPTION="Scans the whole website for media files (images, video, audio, pdf), shows a sortable/filterable overview with thumbnails, file size, location and whether each file is still linked anywhere on the site, with deep links to where linked files are used. Unlinked files can be ignored, or temporarily removed to a protected folder and restored or permanently deleted later. Linked images can be compressed to WebP."
