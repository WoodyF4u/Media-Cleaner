COM_MEDIACLEANER_CONFIG_HIDE_EXT_IMAGES_LABEL="Media files from active extensions"
COM_MEDIACLEANER_CONFIG_HIDE_EXT_IMAGES_DESC="Same idea, but for files in \"/images/.../\" folders belonging to still-installed and active components - see the note above."
COM_MEDIACLEANER_CONFIG_HIDE_THUMBS_LABEL="'thumbs' folders inside 'images'"
COM_MEDIACLEANER_CONFIG_HIDE_THUMBS_DESC="When enabled, newly found unlinked files in folders named 'thumbs' are automatically ignored on scan (they land straight under \"Ignored media\" instead of \"Unlinked media\"), since this is almost always cache the owning extension regenerates itself whenever needed. If you manually un-ignore one, the component remembers that - a later scan won't auto-ignore that specific file again. When disabled, these files stay under \"Unlinked media\" as before, with an explanatory note."
COM_MEDIACLEANER_CONFIG_HIDE_EXT_ASSETS_LABEL="Files from active components/modules/plugins/templates"
COM_MEDIACLEANER_CONFIG_HIDE_EXT_ASSETS_DESC="When enabled, files from still-installed and active extensions are excluded from the \"Delete\" bulk action within the bulk selection, so you can never accidentally sweep them away together with genuinely orphaned files - bulk \"Ignore\" always still works on all hinted files, including these, since that's always reversible per file. The files themselves are always shown and counted in \"Unlinked media\", with a note explaining which extension they probably belong to. Files from disabled or removed extensions are never protected this way, regardless of this setting."

COM_MEDIACLEANER_HELP_PROBABLE_TITLE="Confirmed vs. probably linked"
COM_MEDIACLEANER_HELP_PROBABLE_BODY="Every rescan automatically searches, in addition to Joomla's own articles/modules/menus/etc., every other database table on the site and the source code of templates, plugins and components - so third-party extensions (event calendars, download managers, and so on) are picked up too, without needing to be added by name. A green \"Linked\" badge means the file's full path was found somewhere; an orange \"Probably linked\" badge means only its exact file name was found (some extensions only store a bare filename, not the folder) - almost always a real reference, but double-check before deleting since a filename match is inherently a little less certain than a full path match."
