COM_MEDIACLEANER_CONFIG_LINK_DERIVED_LABEL="Link derived files to their original"
COM_MEDIACLEANER_CONFIG_LINK_DERIVED_DESC="When enabled, the scan recognises automatically generated thumbnails and resized copies of other files, whichever extension creates them. Examples: 'nocrop_512_photo.jpg' in a folder like 'eventgallery_generated' (Event Gallery), 'phoca_thumb_l_photo.jpg' in a 'thumbs' folder (Phoca Gallery) and 'photo-300x200.jpg' next to 'photo.jpg'. If the original is linked, the derived file counts as linked too. If the original is unlinked or no longer exists, the file stays under 'Unlinked media', with an explanatory note. Thumbnails a module generates per article and names by IDs are recognised too, such as '168_164.png' in a 'mod_minifrontpage' folder (article 168 in module 164): these count as linked for as long as both the module and the article are published."
