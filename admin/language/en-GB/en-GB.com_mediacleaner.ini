COM_MEDIACLEANER_HELP_TITLE="Media Cleaner - Help"
COM_MEDIACLEANER_HELP_INTRO_TITLE="About Media Cleaner"
COM_MEDIACLEANER_HELP_FEATURES_TITLE="Media Cleaner features"
COM_MEDIACLEANER_HELP_RESCAN_TITLE="Rescan"
COM_MEDIACLEANER_HELP_RESCAN_BODY="Scans the whole website again and refreshes the overview. Needed after adding, removing or changing files or content elsewhere on the site, and after changing a setting on the Options screen. Also starts automatically in the background after installing an update."
COM_MEDIACLEANER_HELP_FILTERS_TITLE="All media / Linked media / Unlinked media / Ignored media"
COM_MEDIACLEANER_HELP_FILTERS_BODY="Four equally-weighted buttons, each with its own complete overview: \"All media\" shows everything, \"Linked media\" and \"Unlinked media\" filter by linked status, and \"Ignored media\" shows every file you've deliberately marked as ignored (see \"Ignore\" below) - regardless of whether it was linked or not. One more link sits alongside these, \"Deleted media\", which opens a separate overview - see below."
COM_MEDIACLEANER_HELP_IGNORE_TOGGLE_TITLE="Bulk selection to ignore/delete"
COM_MEDIACLEANER_HELP_IGNORE_TOGGLE_BODY="Appears on \"Unlinked media\" and \"Linked media\" once files carrying an extension hint exist (see \"Might belong to extension ...\" above). Lets you ignore every file with that same hint in one go, without checking them off one by one - useful when an extension leaves behind hundreds of separate files, or when a template or plugin fills the list with dozens of \"Probably linked\" files. On \"Linked media\" only ignoring is offered, never deleting - that stays reserved for \"Unlinked media\", to avoid accidentally deleting files a still-active extension genuinely uses."
COM_MEDIACLEANER_HELP_IGNORE_ACTION_TITLE="Ignore / Restore ignored"
COM_MEDIACLEANER_HELP_IGNORE_ACTION_BODY="Marks an unlinked file as deliberately kept and moves it into the \"Ignored media\" overview (see above), so it's no longer shown as something needing attention under Unlinked. Nothing is moved or deleted on disk. \"Restore ignored\" undoes this."
COM_MEDIACLEANER_HELP_DELETE_TITLE="Delete (temporary)"
COM_MEDIACLEANER_HELP_DELETE_BODY="Moves an unlinked file to a protected, temporary folder - unreachable from the website, but not yet permanently gone. Available per file, or for several selected files at once via the \"Action for selected items\" dropdown above the table."
COM_MEDIACLEANER_HELP_QUARANTINE_TITLE="Deleted media"
COM_MEDIACLEANER_HELP_QUARANTINE_BODY="Opens the overview of all temporarily removed files (also referred to as \"Temporarily removed\"), including a thumbnail preview per file. From here you can restore them to their original location, or delete them permanently."
COM_MEDIACLEANER_HELP_COLUMNS_TITLE="The columns"
COM_MEDIACLEANER_HELP_COLUMNS_BODY="Preview shows a thumbnail (or a neutral icon when that isn't possible); File name, File size, Location and Type are self-explanatory; Linked shows whether the file is still in use; Action holds the buttons to manage the file."
COM_MEDIACLEANER_HELP_REFERENCES_TITLE="Deep links (on Linked media)"
COM_MEDIACLEANER_HELP_REFERENCES_BODY="Under the file name of linked files you'll see exactly where the file is used (e.g. an article or module), with a direct link to the relevant edit screen."
COM_MEDIACLEANER_HELP_WEBP_TITLE="Compress tab"
COM_MEDIACLEANER_HELP_WEBP_BODY="Makes large JPGs, PNGs and PDFs smaller, or converts images to WebP. You choose what happens per kind of file. When converting (PNG to JPG, to WebP) the file gets a new name and Media Cleaner updates every reference in the database itself; the old values are kept. The original of every file is kept. Restore in the log puts a file back, including its references. When all is well, download the originals as ZIP and delete them for good to really free the space."
COM_MEDIACLEANER_HELP_DUPLICATES_TITLE="Duplicate copies"
COM_MEDIACLEANER_HELP_DUPLICATES_BODY="Reached from the Clean up tab. Finds unlinked files that are byte for byte the same as a linked file. Those copies can be moved to Temporarily removed in one go."
COM_MEDIACLEANER_HELP_STORAGE_TITLE="Storage folder"
COM_MEDIACLEANER_HELP_STORAGE_BODY="Temporarily removed files and the originals of compressed files are kept in one storage folder: preferably outside the web root, otherwise in the folder mediacleaner in the Joomla root, shielded by .htaccess and web.config (fixed contents, the same in every version). The folder stays when Media Cleaner is uninstalled. A folder of your own can be set in Options, Compress tab."
COM_MEDIACLEANER_HELP_ORPHANED_TITLE="\"May belong to a Joomla extension that is no longer installed\" / \"Might belong to extension: ...\""
COM_MEDIACLEANER_HELP_ORPHANED_BODY="These notes appear under the location of a file. Whether it sits in the \"images\" folder, or in a component, module, plugin or template folder, the extension is named directly whenever the folder name matches an installed extension (active or not) - or, if that extension can no longer be found, one that used to sit there (\"... but this extension appears to have been removed\"). This name hint also appears on \"Linked media\" (often \"Probably linked\" files belonging to the active template itself). When no name can be determined, an unlinked file in a component, module, plugin or template folder still shows a general warning that the extension may no longer be installed. Often a sign the file was left behind after the matching extension was disabled or removed."
COM_MEDIACLEANER_HELP_OPTIONS_TITLE="Options (Settings tab)"
COM_MEDIACLEANER_HELP_OPTIONS_BODY="Three switches on this tab add extra explanation and protection in \"Unlinked media\", for files in folders named \"thumbs\", files from active components/modules/plugins/templates, and media files from active extensions. These files are always shown and counted under \"Unlinked media\" regardless - the switches only control whether an explanatory note is shown (the first one) and whether they're excluded from the \"Bulkselectie voor negeren/verwijderen\" bulk action (the last two), so you never accidentally sweep away files a still-active extension genuinely uses. Saving Options automatically starts a fresh rescan."

; Frontend (site) access permissions - shown on the "Permissions" tab of the
; component Options screen.
COM_MEDIACLEANER_ACL_SITE_VIEW="Site: View overview"
COM_MEDIACLEANER_ACL_SITE_VIEW_DESC="Allows a user to view the media overview on the website frontend, when it is linked to a menu item. Nothing is granted here by default, so linking the menu item to a broadly-visible access level (e.g. Public) does not by itself expose anything - a group still needs this permission explicitly."
COM_MEDIACLEANER_ACL_SITE_IGNORE="Site: Ignore files"
COM_MEDIACLEANER_ACL_SITE_IGNORE_DESC="Allows a user to mark files as ignored (and restore that) from the website frontend. Requires \"Site: View overview\" as well. Never available to visitors who are not logged in, regardless of this setting."
COM_MEDIACLEANER_ACL_SITE_DELETE="Site: Delete files"
COM_MEDIACLEANER_ACL_SITE_DELETE_DESC="Allows a user to move files to quarantine from the website frontend. Requires \"Site: View overview\" as well. Never available to visitors who are not logged in, regardless of this setting."

