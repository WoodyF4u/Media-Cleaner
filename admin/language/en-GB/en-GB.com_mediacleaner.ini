COM_MEDIACLEANER_LINK_CHECK_NOTE="Media Cleaner searches Joomla's own articles, modules, categories, menu items, custom fields, contacts and banners, plus every other database table on the site, and the source code (PHP/CSS/JS/XML) of templates, plugins, modules and components - so third-party extensions are picked up too, without needing to know their name in advance. It can't detect files that are only referenced somewhere else entirely (e.g. a hand-edited server config file, or code outside those folders). Always double-check before deleting files marked \"Not linked\"."
