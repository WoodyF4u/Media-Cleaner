name: Build and release Media Cleaner

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Determine version from tag
        id: version
        run: |
          version="${{ github.event.release.tag_name }}"
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"

      - name: Build installation zip
        run: |
          zip -r "com_mediacleaner_v${{ steps.version.outputs.version }}.zip" \
            admin \
            site \
            media \
            mediacleaner.xml \
            script.php

      - name: Compute checksum and download URL
        id: meta
        run: |
          version="${{ steps.version.outputs.version }}"
          sha256=$(sha256sum "com_mediacleaner_v${version}.zip" | awk '{print $1}')
          download_url="https://github.com/${{ github.repository }}/releases/download/v${version}/com_mediacleaner_v${version}.zip"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "download_url=$download_url" >> "$GITHUB_OUTPUT"

      - name: Update updates.xml
        run: |
          version="${{ steps.version.outputs.version }}"
          sha256="${{ steps.meta.outputs.sha256 }}"
          download_url="${{ steps.meta.outputs.download_url }}"
          sed -i "s#<version>.*</version>#<version>${version}</version>#" updates.xml
          sed -i "s#<downloadurl type=\"full\" format=\"zip\">.*</downloadurl>#<downloadurl type=\"full\" format=\"zip\">${download_url}</downloadurl>#" updates.xml
          sed -i "s#<sha256>.*</sha256>#<sha256>${sha256}</sha256>#" updates.xml

      - name: Commit updated updates.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updates.xml
          if git diff --cached --quiet; then
            echo "Geen wijzigingen om te committen"
          else
            git commit -m "updates.xml bijgewerkt naar v${{ steps.version.outputs.version }}"
            git push origin HEAD:main
          fi

      - name: Upload asset to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: com_mediacleaner_v${{ steps.version.outputs.version }}.zip
