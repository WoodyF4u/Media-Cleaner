name: Build and release Media Cleaner

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build installation zip
        run: |
          zip -r "com_mediacleaner_v${{ steps.version.outputs.version }}.zip" \
            admin \
            site \
            media \
            mediacleaner.xml \
            script.php

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: com_mediacleaner_v${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
