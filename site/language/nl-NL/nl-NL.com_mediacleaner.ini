; Media Cleaner - taalbestand voor de website (frontend).
;
; Joomla laadt de taalbestanden van de voor- en achterkant van een component
; los van elkaar, dus de subset aan teksten die de frontend views/
; controllers echt gebruiken staat hier nogmaals (woord voor woord gelijk
; gehouden aan de bijbehorende sleutels in administrator/language) in
; plaats van gedeeld te worden.

